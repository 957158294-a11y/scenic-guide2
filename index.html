<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中越德天（板约）瀑布跨境旅游合作区讲解</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #3B7D5E;
            --bg: #F6F5F2;
            --card-bg: #FFFFFF;
            --text: #2D3436;
            --text-light: #636E72;
            --shadow: 0 2px 12px rgba(0,0,0,0.07);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:20px; }
        .header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.9); backdrop-filter:blur(20px); padding:0 16px; height:60px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; }
        .header-title { font-weight:700; color:var(--primary); font-size:1rem; line-height:1.3; }
        .lang-area { display:flex; flex-direction:column; align-items:flex-end; }
        .lang-toggle { display:flex; background:#f0f0f0; border-radius:20px; padding:3px; }
        .lang-toggle button { padding:6px 12px; border:none; background:transparent; border-radius:20px; font-weight:600; color:#666; cursor:pointer; font-family:inherit; font-size:0.85rem; }
        .lang-toggle button.active { background:#fff; color:var(--primary); box-shadow:0 2px 6px rgba(0,0,0,0.1); }
        .lang-hint { font-size:0.7rem; color:#999; margin-top:4px; }
        .main-container { max-width:700px; margin:0 auto; padding:20px 16px; }
        .spot-grid { display:flex; flex-direction:column; gap:14px; }
        .spot-card { background:var(--card-bg); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); cursor:pointer; display:flex; }
        .spot-card img { width:100px; height:100px; object-fit:cover; flex-shrink:0; }
        .spot-card .card-body { padding:12px 14px; flex:1; display:flex; flex-direction:column; justify-content:center; }
        .spot-card .card-name { font-weight:700; margin-bottom:4px; }
        .spot-card .card-desc { font-size:0.85rem; color:var(--text-light); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
        .modal-sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; padding:20px; }
        .detail-image { width:100%; max-height:300px; object-fit:cover; border-radius:12px; margin-bottom:16px; }
        .detail-name { font-size:1.3rem; font-weight:700; margin-bottom:10px; }
        .detail-desc { font-size:0.95rem; color:var(--text-light); line-height:1.7; margin-bottom:20px; white-space:pre-wrap; }
        .audio-hint { font-size:0.85rem; color:var(--primary); margin-bottom:8px; font-weight:600; }
        .audio-player { display:flex; align-items:center; gap:12px; background:#f9faf9; border-radius:30px; padding:10px 16px; margin-bottom:10px; }
        .play-btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:1.2rem; cursor:pointer; flex-shrink:0; }
        .progress-bar { flex:1; height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; cursor:pointer; }
        .progress-fill { height:100%; background:var(--primary); width:0%; border-radius:3px; }
        .time-info { display:flex; justify-content:space-between; font-size:0.75rem; color:#999; margin-top:4px; }
        .no-audio { color:#999; font-style:italic; }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border:none; border-radius:25px; font-weight:600; cursor:pointer; font-family:inherit; }
        .btn-accent { background:#F0A860; color:#fff; }
        .qr-container { text-align:center; padding:10px 0; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#333; color:#fff; padding:12px 24px; border-radius:25px; z-index:500; transition:0.35s; white-space:nowrap; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        @media (max-width:400px) { .spot-card img { width:80px; height:80px; } .header-title { font-size:0.9rem; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title" id="headerTitle">中越德天（板约）瀑布跨境旅游合作区讲解</div>
        <div class="lang-area">
            <div class="lang-toggle" id="langToggle">
                <button data-lang="zh" class="active">中</button>
                <button data-lang="en">EN</button>
                <button data-lang="vi">VI</button>
            </div>
            <div class="lang-hint" id="langHint">切换语言</div>
        </div>
    </header>

    <div class="main-container">
        <!-- 点位列表（扫码直达时隐藏列表，只显示详情） -->
        <div id="spotListView">
            <div class="spot-grid" id="spotGrid"></div>
            <p id="emptyMsg" style="text-align:center;color:#999;padding:40px;display:none;">暂无讲解点位</p>
        </div>

        <!-- 点位详情（独立视图） -->
        <div id="spotDetailView" style="display:none;">
            <div id="detailContent"></div>
            <div style="text-align:center; margin-top:10px;">
                <button class="btn btn-accent" id="btnShowQR" data-i18n="shareQR">📱 分享二维码</button>
            </div>
        </div>
    </div>

    <!-- 二维码弹窗 -->
    <div class="modal-overlay" id="modalQR" style="display:none;">
        <div class="modal-sheet" style="text-align:center;">
            <button style="float:right; background:none; border:none; font-size:1.5rem; cursor:pointer;" id="btnCloseQR">✕</button>
            <h3 id="qrTitle" style="margin-bottom:16px;">扫码听讲解</h3>
            <div id="qrCanvasWrapper" style="display:inline-block; padding:16px; background:#fff; border-radius:12px;"></div>
            <p id="qrHint" style="font-size:0.8rem; color:#999; margin:12px 0;">长按识别二维码打开</p>
            <button class="btn btn-accent" id="btnCopyURL" data-i18n="copyLink">📋 复制链接</button>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;" preload="metadata"></audio>
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // 多语言字典
            const i18n = {
                zh: {
                    headerTitle: '中越德天（板约）瀑布跨境旅游合作区讲解',
                    langHint: '切换语言',
                    audioHint: '点击播放语音讲解',
                    shareQR: '📱 分享二维码',
                    qrTitle: '扫码听讲解',
                    qrHint: '长按识别二维码打开',
                    copyLink: '📋 复制链接',
                    noSpots: '暂无讲解点位',
                    noAudio: '暂无该语言讲解音频',
                    urlCopied: '链接已复制',
                    loading: '正在加载讲解内容…',
                    loadError: '网络不稳定，讲解内容加载失败，请稍后刷新重试。'
                },
                en: {
                    headerTitle: 'China-Vietnam Detian (Ban Gioc) Waterfall Cross-border Tourism Cooperation Zone Guide',
                    langHint: 'Switch Language',
                    audioHint: 'Tap to play audio guide',
                    shareQR: '📱 Share QR Code',
                    qrTitle: 'Scan to listen',
                    qrHint: 'Long press to scan QR code',
                    copyLink: '📋 Copy Link',
                    noSpots: 'No spots available',
                    noAudio: 'No audio for this language',
                    urlCopied: 'Link copied',
                    loading: 'Loading audio guide…',
                    loadError: 'Network unstable, failed to load content. Please refresh later.'
                },
                vi: {
                    headerTitle: 'Khu Hợp Tác Du Lịch Xuyên Biên Giới Thác Detian (Bản Giốc) Việt-Trung',
                    langHint: 'Đổi ngôn ngữ',
                    audioHint: 'Nhấn để nghe thuyết minh',
                    shareQR: '📱 Chia sẻ mã QR',
                    qrTitle: 'Quét mã để nghe',
                    qrHint: 'Nhấn giữ để quét mã QR',
                    copyLink: '📋 Sao chép liên kết',
                    noSpots: 'Không có điểm thuyết minh',
                    noAudio: 'Không có âm thanh cho ngôn ngữ này',
                    urlCopied: 'Đã sao chép liên kết',
                    loading: 'Đang tải nội dung…',
                    loadError: 'Mạng không ổn định, không thể tải nội dung. Vui lòng làm mới sau.'
                }
            };

            const $ = s => document.querySelector(s);
            const domSpotGrid = $('#spotGrid');
            const domEmpty = $('#emptyMsg');
            const domListView = $('#spotListView');
            const domDetailView = $('#spotDetailView');
            const domDetailContent = $('#detailContent');
            const domModalQR = $('#modalQR');
            const domAudio = $('#audioPlayer');
            const domToast = $('#toast');
            const domHeaderTitle = $('#headerTitle');
            const domLangHint = $('#langHint');

            let currentLang = 'zh';
            let spots = [];
            let currentSpot = null;

            // 更新界面上的所有多语言文本
            function applyLanguage() {
                domHeaderTitle.textContent = i18n[currentLang].headerTitle;
                domLangHint.textContent = i18n[currentLang].langHint;
                document.getElementById('emptyMsg').textContent = i18n[currentLang].noSpots;
                // 更新二维码按钮和弹窗文本（如果正在显示）
                const btnShare = $('#btnShowQR');
                if (btnShare) btnShare.innerHTML = i18n[currentLang].shareQR;
                const qrTitle = $('#qrTitle');
                if (qrTitle) qrTitle.textContent = i18n[currentLang].qrTitle;
                const qrHint = $('#qrHint');
                if (qrHint) qrHint.textContent = i18n[currentLang].qrHint;
                const btnCopy = $('#btnCopyURL');
                if (btnCopy) btnCopy.innerHTML = i18n[currentLang].copyLink;
                // 详情页中的音频提示
                const audioHintEl = document.getElementById('audioHintText');
                if (audioHintEl) audioHintEl.textContent = i18n[currentLang].audioHint;
                // 更新详情标题和描述（如果详情正在显示）
                if (currentSpot && domDetailView.style.display !== 'none') {
                    renderDetail();
                }
            }

            async function loadSpots() {
                // 加载动画和重试逻辑已省略，保持简洁，如有需要可加回
                try {
                    const res = await fetch('spots.json?t=' + Date.now());
                    spots = await res.json();
                } catch(e) {
                    spots = [];
                }
                renderSpotList();
                checkURLParams();
                applyLanguage();
            }

            function renderSpotList() {
                domSpotGrid.innerHTML = '';
                if (spots.length === 0) {
                    domEmpty.style.display = '';
                    domSpotGrid.style.display = 'none';
                    return;
                }
                domEmpty.style.display = 'none';
                domSpotGrid.style.display = '';
                spots.forEach(spot => {
                    const card = document.createElement('div');
                    card.className = 'spot-card';
                    card.onclick = () => showDetail(spot.id);
                    const img = document.createElement('img');
                    img.src = spot.image || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%23ddd"><rect width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23999" font-size="14">无图</text></svg>';
                    const body = document.createElement('div');
                    body.className = 'card-body';
                    body.innerHTML = `<div class="card-name">${escapeHtml(spot.name[currentLang] || spot.name.zh || '')}</div><div class="card-desc">${escapeHtml((spot.description[currentLang] || spot.description.zh || '').substring(0,80))}</div>`;
                    card.appendChild(img);
                    card.appendChild(body);
                    domSpotGrid.appendChild(card);
                });
            }

            function showDetail(id) {
                const spot = spots.find(s => s.id === id);
                if (!spot) return;
                currentSpot = spot;
                renderDetail();
                domListView.style.display = 'none';
                domDetailView.style.display = '';
            }

            function renderDetail() {
                if (!currentSpot) return;
                const spot = currentSpot;
                let html = '';
                if (spot.image) html += `<img class="detail-image" src="${spot.image}">`;
                html += `<div class="detail-name">${escapeHtml(spot.name[currentLang] || spot.name.zh || '')}</div>`;
                html += `<div class="detail-desc">${escapeHtml(spot.description[currentLang] || spot.description.zh || '')}</div>`;

                const audioSrc = spot.audio?.[currentLang] || '';
                if (audioSrc) {
                    html += `<div class="audio-hint" id="audioHintText">${i18n[currentLang].audioHint}</div>`;
                    html += `
                    <div class="audio-player">
                        <button class="play-btn" id="detailPlayBtn">▶</button>
                        <div style="flex:1;">
                            <div class="progress-bar" id="detailProgressBar"><div class="progress-fill" id="detailProgressFill"></div></div>
                            <div class="time-info"><span id="timeCur">00:00</span><span id="timeDur">--:--</span></div>
                        </div>
                    </div>`;
                } else {
                    html += `<p class="no-audio">${i18n[currentLang].noAudio}</p>`;
                }
                domDetailContent.innerHTML = html;
                if (audioSrc) setupAudio(audioSrc);
            }

            function setupAudio(src) {
                const playBtn = $('#detailPlayBtn');
                if (!playBtn) return;
                const fill = $('#detailProgressFill');
                const timeCur = $('#timeCur');
                const timeDur = $('#timeDur');
                let playing = false;

                const loadAudio = () => { domAudio.src = src; domAudio.load(); };
                playBtn.onclick = () => {
                    if (playing) { domAudio.pause(); playing = false; playBtn.textContent = '▶'; }
                    else {
                        if (domAudio.src !== src || domAudio.readyState === 0) loadAudio();
                        domAudio.play().then(() => { playing = true; playBtn.textContent = '⏸'; }).catch(() => {});
                    }
                };
                domAudio.ontimeupdate = () => {
                    if (domAudio.duration) {
                        fill.style.width = (domAudio.currentTime / domAudio.duration) * 100 + '%';
                        timeCur.textContent = formatTime(domAudio.currentTime);
                    }
                };
                domAudio.onloadedmetadata = () => { if (domAudio.duration) timeDur.textContent = formatTime(domAudio.duration); };
                domAudio.onended = () => { playing = false; playBtn.textContent = '▶'; fill.style.width = '0%'; timeCur.textContent = '00:00'; };
                const progressBar = $('#detailProgressBar');
                if (progressBar) {
                    progressBar.onclick = (e) => {
                        if (!domAudio.duration) return;
                        const rect = progressBar.getBoundingClientRect();
                        domAudio.currentTime = ((e.clientX - rect.left) / rect.width) * domAudio.duration;
                    };
                }
                loadAudio();
            }

            function backToList() {
                domAudio.pause();
                domListView.style.display = '';
                domDetailView.style.display = 'none';
                currentSpot = null;
            }

            // 语言切换
            document.getElementById('langToggle').addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const lang = btn.dataset.lang;
                if (lang === currentLang) return;
                currentLang = lang;
                document.querySelectorAll('#langToggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applyLanguage();
                if (currentSpot && domDetailView.style.display !== 'none') {
                    renderDetail();
                } else {
                    renderSpotList();
                }
            });

            // 二维码
            $('#btnShowQR').addEventListener('click', () => {
                if (!currentSpot) return;
                const url = window.location.origin + window.location.pathname + '?point=' + currentSpot.id;
                $('#qrCanvasWrapper').innerHTML = '';
                domModalQR.style.display = 'flex';
                // 设置弹窗文本
                $('#qrTitle').textContent = i18n[currentLang].qrTitle;
                $('#qrHint').textContent = i18n[currentLang].qrHint;
                $('#btnCopyURL').innerHTML = i18n[currentLang].copyLink;
                try { new QRCode($('#qrCanvasWrapper'), { text: url, width: 200, height: 200, colorDark: '#2D3436' }); } catch(e) {}
            });
            $('#btnCloseQR').addEventListener('click', () => { domModalQR.style.display = 'none'; $('#qrCanvasWrapper').innerHTML = ''; });
            domModalQR.addEventListener('click', e => { if (e.target === domModalQR) { domModalQR.style.display = 'none'; $('#qrCanvasWrapper').innerHTML = ''; } });
            $('#btnCopyURL').addEventListener('click', () => {
                const url = window.location.origin + window.location.pathname + '?point=' + currentSpot.id;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(() => showToast(i18n[currentLang].urlCopied));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast(i18n[currentLang].urlCopied);
                }
            });

            function checkURLParams() {
                const id = new URLSearchParams(window.location.search).get('point');
                if (id) {
                    setTimeout(() => {
                        const spot = spots.find(s => s.id === id);
                        if (spot) showDetail(id);
                    }, 400);
                }
            }

            function showToast(msg) {
                domToast.textContent = msg;
                domToast.className = 'toast show';
                setTimeout(() => domToast.classList.remove('show'), 2000);
            }
            function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function formatTime(s) { const m = Math.floor(s / 60), sec = Math.floor(s % 60); return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0'); }

            loadSpots();
        })();
    </script>
</body>
</html>
