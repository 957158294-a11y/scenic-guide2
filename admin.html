<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>景区讲解管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #3B7D5E;
            --bg: #F6F5F2;
            --card-bg: #FFFFFF;
            --text: #2D3436;
            --text-light: #636E72;
            --shadow: 0 2px 12px rgba(0,0,0,0.07);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:20px; }
        .header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.9); backdrop-filter:blur(20px); padding:0 16px; height:60px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; }
        .header-title { font-weight:700; color:var(--primary); }
        .lang-toggle { display:flex; background:#f0f0f0; border-radius:20px; padding:3px; }
        .lang-toggle button { padding:6px 12px; border:none; background:transparent; border-radius:20px; font-weight:600; color:#666; cursor:pointer; font-family:inherit; font-size:0.85rem; }
        .lang-toggle button.active { background:#fff; color:var(--primary); box-shadow:0 2px 6px rgba(0,0,0,0.1); }
        .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border:none; border-radius:25px; font-weight:600; cursor:pointer; font-family:inherit; font-size:0.9rem; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-accent { background:#F0A860; color:#fff; }
        .btn-danger { background:#E85D5D; color:#fff; }
        .btn-warning { background:#f0a860; color:#fff; }
        .main-container { max-width:1000px; margin:0 auto; padding:20px 16px; }
        .spot-list { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
        .spot-item { background:#fff; border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; }
        .spot-item img { width:60px; height:60px; object-fit:cover; border-radius:8px; }
        .spot-item .info { flex:1; }
        .spot-item .name { font-weight:700; margin-bottom:4px; }
        .spot-item .desc { font-size:0.8rem; color:var(--text-light); }
        .spot-item .actions { display:flex; gap:6px; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
        .modal-sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:700px; max-height:90vh; overflow-y:auto; padding:20px; }
        .form-group { margin-bottom:16px; }
        .form-label { font-weight:600; margin-bottom:6px; display:block; }
        .lang-badge { display:inline-block; background:#eef5f1; color:var(--primary); padding:2px 8px; border-radius:10px; font-size:0.7rem; margin-right:4px; }
        .form-input, .form-textarea { width:100%; padding:10px 14px; border:2px solid #ddd; border-radius:8px; font-family:inherit; font-size:0.9rem; }
        .file-label { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border:2px dashed #ddd; border-radius:25px; cursor:pointer; font-size:0.9rem; }
        .file-label.uploaded { border-color:#4CAF50; background:#f1f8f3; color:#388E3C; }
        .audio-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
        .audio-row .lang-badge { width:30px; text-align:center; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#333; color:#fff; padding:12px 24px; border-radius:25px; z-index:500; transition:0.35s; white-space:nowrap; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.error { background:#D32F2F; }
        .password-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:999; display:flex; align-items:center; justify-content:center; }
        .password-box { background:#fff; padding:30px; border-radius:16px; text-align:center; width:90%; max-width:350px; }
        .info-bar { background:#fff; padding:12px; border-radius:12px; margin-bottom:16px; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    </style>
</head>
<body>
    <!-- 密码验证 -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h2 style="margin-bottom:16px;">🔐 管理后台</h2>
            <input type="password" id="passwordInput" class="form-input" placeholder="请输入管理密码">
            <button class="btn btn-primary" id="btnLogin" style="width:100%; margin-top:12px;">进入后台</button>
            <p id="passwordError" style="color:red; font-size:0.85rem; margin-top:8px; display:none;">密码错误</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="appMain" style="display:none;">
        <header class="header">
            <div class="header-title">🔧 讲解点位管理</div>
            <div style="display:flex; gap:8px; align-items:center;">
                <div class="lang-toggle" id="langToggle">
                    <button data-lang="zh" class="active">中</button>
                    <button data-lang="en">EN</button>
                    <button data-lang="vi">VI</button>
                </div>
                <button class="btn btn-outline btn-sm" id="btnRefresh">🔄 刷新数据</button>
                <button class="btn btn-outline btn-sm" id="btnExport">📤 导出数据</button>
                <button class="btn btn-warning btn-sm" id="btnClearStorage">🗑️ 清除缓存</button>
            </div>
        </header>
        <div class="main-container">
            <div class="info-bar">
                <span>📌 所有文件暂存于浏览器数据库，无容量限制</span>
                <span>点位：<strong id="spotCount">0</strong></span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <span></span>
                <button class="btn btn-primary" id="btnAddSpot">＋ 添加点位</button>
            </div>
            <div class="spot-list" id="spotList"></div>
        </div>

        <!-- 编辑弹窗 -->
        <div class="modal-overlay" id="modalForm" style="display:none;">
            <div class="modal-sheet">
                <button style="float:right; background:none; border:none; font-size:1.5rem; cursor:pointer;" id="btnCloseForm">✕</button>
                <h3 id="formTitle" style="margin-bottom:20px;">添加点位</h3>
                <form id="spotForm">
                    <input type="hidden" id="editId">
                    <div class="form-group"><span class="lang-badge">中</span> 名称 <input class="form-input" id="nameZh" required></div>
                    <div class="form-group"><span class="lang-badge">EN</span> Name <input class="form-input" id="nameEn"></div>
                    <div class="form-group"><span class="lang-badge">VI</span> Tên <input class="form-input" id="nameVi"></div>
                    <div class="form-group"><span class="lang-badge">中</span> 讲解文字 <textarea class="form-textarea" id="descZh" rows="2"></textarea></div>
                    <div class="form-group"><span class="lang-badge">EN</span> Description <textarea class="form-textarea" id="descEn" rows="2"></textarea></div>
                    <div class="form-group"><span class="lang-badge">VI</span> Mô tả <textarea class="form-textarea" id="descVi" rows="2"></textarea></div>
                    <div class="form-group">
                        📷 图片
                        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                            <label class="file-label" id="imageLabel" for="imageInput">📁 选择图片</label>
                            <input type="file" id="imageInput" accept="image/*" style="display:none;">
                            <span id="imageInfo"></span>
                        </div>
                        <img id="imagePreview" style="width:100%; max-height:150px; object-fit:cover; border-radius:8px; margin-top:8px; display:none;">
                    </div>
                    <div class="form-group">
                        🎵 讲解音频（三个语言各上传一个）
                        <div class="audio-row"><span class="lang-badge">中</span><label class="file-label" id="audioZhLabel" for="audioZhInput">🎤 选择文件</label><input type="file" id="audioZhInput" accept="audio/*" style="display:none;"><span id="audioZhInfo"></span></div>
                        <div class="audio-row"><span class="lang-badge">EN</span><label class="file-label" id="audioEnLabel" for="audioEnInput">🎤 选择文件</label><input type="file" id="audioEnInput" accept="audio/*" style="display:none;"><span id="audioEnInfo"></span></div>
                        <div class="audio-row"><span class="lang-badge">VI</span><label class="file-label" id="audioViLabel" for="audioViInput">🎤 选择文件</label><input type="file" id="audioViInput" accept="audio/*" style="display:none;"><span id="audioViInfo"></span></div>
                    </div>
                    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                        <button type="button" class="btn btn-outline" id="btnCancelForm">取消</button>
                        <button type="submit" class="btn btn-primary">💾 保存</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 二维码弹窗 -->
        <div class="modal-overlay" id="modalQR" style="display:none;">
            <div class="modal-sheet" style="text-align:center;">
                <button style="float:right; background:none; border:none; font-size:1.5rem; cursor:pointer;" id="btnCloseQR">✕</button>
                <h3>📱 扫码讲解</h3>
                <div id="qrCanvas" style="display:inline-block; padding:16px; background:#fff; border-radius:12px;"></div>
                <p id="qrUrlText" style="font-size:0.8rem; color:#999; margin:12px 0; word-break:break-all;"></p>
                <button class="btn btn-accent" id="btnCopyQR">📋 复制链接</button>
            </div>
        </div>
    </div>

    <audio id="audioPreview" style="display:none;"></audio>
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const ADMIN_PASSWORD = 'admin888';
            const STORAGE_KEY = 'scenic_admin_spots_meta'; // 只存元数据，不含Base64文件
            const DB_NAME = 'scenic_files_db';
            const DB_VERSION = 1;
            const STORE_NAME = 'files';

            const $ = s => document.querySelector(s);
            let spots = []; // 存储点位元数据，图片/音频字段为数据库中的key或空
            let currentLang = 'zh';
            let editingId = null;
            // 当前表单中待上传的文件（图片及三语音频），以Blob形式暂存
            let pendingImageBlob = null;
            let pendingImagePreviewUrl = null;
            let pendingAudioBlobs = { zh: null, en: null, vi: null };
            let pendingAudioNames = { zh: '', en: '', vi: '' };

            // IndexedDB 初始化
            let db = null;
            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        db = e.target.result;
                        resolve(db);
                    };
                    request.onerror = (e) => reject(e.target.error);
                });
            }
            function saveFileToDB(id, blob) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put({ id, blob });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            function getFileFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result ? request.result.blob : null);
                    request.onerror = () => reject(request.error);
                });
            }
            function deleteFileFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            function blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }

            // 密码
            $('#btnLogin').addEventListener('click', async () => {
                if ($('#passwordInput').value === ADMIN_PASSWORD) {
                    $('#passwordOverlay').style.display = 'none';
                    $('#appMain').style.display = '';
                    await openDB();
                    await init();
                } else {
                    $('#passwordError').style.display = '';
                }
            });
            $('#passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });

            async function init() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        spots = JSON.parse(saved);
                    } catch (e) {
                        spots = [];
                    }
                    console.log('从本地缓存加载了', spots.length, '个点位');
                } else {
                    await loadFromServer();
                }
                // 刷新所有预览图（从IDB读取blob生成blob URL）
                await refreshAllPreviews();
                renderList();
                bindEvents();
            }

            async function refreshAllPreviews() {
                for (let spot of spots) {
                    if (spot._imageKey) {
                        const blob = await getFileFromDB(spot._imageKey);
                        if (blob) spot._imageUrl = URL.createObjectURL(blob);
                    }
                }
            }

            async function loadFromServer() {
                try {
                    const res = await fetch('spots.json?t=' + Date.now());
                    const serverSpots = await res.json();
                    // 将服务器数据转为本地元数据（图片音频存入IDB，并用key替换）
                    spots = [];
                    for (const item of serverSpots) {
                        const spotMeta = {
                            id: item.id,
                            name: {...item.name},
                            description: {...item.description},
                            createdAt: item.createdAt || Date.now(),
                            _imageKey: null,
                            _audioKeys: { zh: null, en: null, vi: null }
                        };
                        // 处理图片
                        if (item.image && item.image.startsWith('data:')) {
                            const blob = dataURLtoBlob(item.image);
                            const key = 'img_' + item.id;
                            await saveFileToDB(key, blob);
                            spotMeta._imageKey = key;
                            spotMeta._imageUrl = URL.createObjectURL(blob);
                        }
                        // 处理音频
                        for (const lang of ['zh','en','vi']) {
                            const audioSrc = item.audio?.[lang];
                            if (audioSrc && audioSrc.startsWith('data:')) {
                                const blob = dataURLtoBlob(audioSrc);
                                const key = `audio_${lang}_${item.id}`;
                                await saveFileToDB(key, blob);
                                spotMeta._audioKeys[lang] = key;
                            }
                        }
                        spots.push(spotMeta);
                    }
                    saveLocalMeta();
                    console.log('从服务器加载并转换了', spots.length, '个点位');
                } catch(e) {
                    spots = [];
                }
            }

            function dataURLtoBlob(dataurl) {
                const arr = dataurl.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--) u8arr[n] = bstr.charCodeAt(n);
                return new Blob([u8arr], {type: mime});
            }

            function renderList() {
                $('#spotCount').textContent = spots.length;
                const list = $('#spotList');
                list.innerHTML = '';
                spots.forEach(spot => {
                    const item = document.createElement('div');
                    item.className = 'spot-item';
                    const imgSrc = spot._imageUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="%23ddd"><rect width="60" height="60"/></svg>';
                    item.innerHTML = `
                        <img src="${imgSrc}">
                        <div class="info">
                            <div class="name">${escapeHtml(spot.name[currentLang] || spot.name.zh || '未命名')}</div>
                            <div class="desc">${escapeHtml((spot.description[currentLang] || spot.description.zh || '').substring(0,60))}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-accent btn-sm qr-btn">📱</button>
                            <button class="btn btn-outline btn-sm edit-btn">✏️</button>
                            <button class="btn btn-danger btn-sm del-btn">🗑️</button>
                        </div>
                    `;
                    item.querySelector('.qr-btn').onclick = () => showQR(spot.id);
                    item.querySelector('.edit-btn').onclick = () => openEdit(spot.id);
                    item.querySelector('.del-btn').onclick = async () => {
                        if (confirm('确定删除？')) {
                            // 删除关联的IDB文件
                            if (spot._imageKey) await deleteFileFromDB(spot._imageKey);
                            for (let lang of ['zh','en','vi']) {
                                const key = spot._audioKeys[lang];
                                if (key) await deleteFileFromDB(key);
                            }
                            spots = spots.filter(s => s.id !== spot.id);
                            saveLocalMeta();
                            renderList();
                            showToast('已删除');
                        }
                    };
                    list.appendChild(item);
                });
            }

            function bindEvents() {
                $('#btnAddSpot').addEventListener('click', openAdd);
                $('#btnCloseForm').addEventListener('click', closeForm);
                $('#btnCancelForm').addEventListener('click', closeForm);
                $('#btnExport').addEventListener('click', exportData);
                $('#btnRefresh').addEventListener('click', async () => {
                    if (confirm('刷新将从服务器重新加载数据，本地未导出修改可能丢失，确定继续？')) {
                        // 清空IDB中的旧文件
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        tx.objectStore(STORE_NAME).clear();
                        await tx.done;
                        localStorage.removeItem(STORAGE_KEY);
                        spots = [];
                        await loadFromServer();
                        renderList();
                        showToast('已从服务器同步');
                    }
                });
                $('#btnClearStorage').addEventListener('click', async () => {
                    if (confirm('确定要清除所有本地缓存（包括上传的文件）吗？此操作不会影响服务器数据。')) {
                        const tx = db.transaction(STORE_NAME, 'readwrite');
                        tx.objectStore(STORE_NAME).clear();
                        await tx.done;
                        localStorage.removeItem(STORAGE_KEY);
                        spots = [];
                        renderList();
                        showToast('本地缓存已清除');
                    }
                });
                $('#btnCloseQR').addEventListener('click', () => { $('#modalQR').style.display = 'none'; $('#qrCanvas').innerHTML = ''; });
                $('#btnCopyQR').addEventListener('click', () => {
                    const url = $('#qrUrlText').textContent;
                    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => showToast('链接已复制'));
                });
                document.getElementById('langToggle').addEventListener('click', e => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    currentLang = btn.dataset.lang;
                    document.querySelectorAll('#langToggle button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderList();
                });

                // 图片上传
                $('#imageInput').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    pendingImageBlob = file;
                    if (pendingImagePreviewUrl) URL.revokeObjectURL(pendingImagePreviewUrl);
                    pendingImagePreviewUrl = URL.createObjectURL(file);
                    $('#imagePreview').src = pendingImagePreviewUrl;
                    $('#imagePreview').style.display = '';
                    $('#imageInfo').textContent = file.name;
                    $('#imageLabel').classList.add('uploaded');
                });

                const setupAudioUpload = (lang, inputId, labelId, infoId) => {
                    $(`#${inputId}`).addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (!file) return;
                        pendingAudioBlobs[lang] = file;
                        pendingAudioNames[lang] = file.name;
                        $(`#${infoId}`).textContent = file.name;
                        $(`#${labelId}`).classList.add('uploaded');
                    });
                };
                setupAudioUpload('zh', 'audioZhInput', 'audioZhLabel', 'audioZhInfo');
                setupAudioUpload('en', 'audioEnInput', 'audioEnLabel', 'audioEnInfo');
                setupAudioUpload('vi', 'audioViInput', 'audioViLabel', 'audioViInfo');

                $('#spotForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    // 保存当前编辑的点位
                    const spotId = editingId || 'spot_' + Date.now();
                    let spotMeta = {
                        id: spotId,
                        name: { zh: $('#nameZh').value.trim(), en: $('#nameEn').value.trim(), vi: $('#nameVi').value.trim() },
                        description: { zh: $('#descZh').value.trim(), en: $('#descEn').value.trim(), vi: $('#descVi').value.trim() },
                        createdAt: editingId ? (spots.find(s => s.id === editingId)?.createdAt || Date.now()) : Date.now(),
                        _imageKey: null,
                        _audioKeys: { zh: null, en: null, vi: null },
                        _imageUrl: null
                    };

                    // 处理图片
                    if (pendingImageBlob) {
                        const key = 'img_' + spotId;
                        await saveFileToDB(key, pendingImageBlob);
                        spotMeta._imageKey = key;
                        spotMeta._imageUrl = URL.createObjectURL(pendingImageBlob);
                    } else if (editingId) {
                        // 保留原有图片
                        const oldSpot = spots.find(s => s.id === editingId);
                        if (oldSpot) {
                            spotMeta._imageKey = oldSpot._imageKey;
                            spotMeta._imageUrl = oldSpot._imageUrl;
                        }
                    }

                    // 处理音频
                    for (const lang of ['zh','en','vi']) {
                        if (pendingAudioBlobs[lang]) {
                            const key = `audio_${lang}_${spotId}`;
                            await saveFileToDB(key, pendingAudioBlobs[lang]);
                            spotMeta._audioKeys[lang] = key;
                        } else if (editingId) {
                            const oldSpot = spots.find(s => s.id === editingId);
                            if (oldSpot && oldSpot._audioKeys[lang]) {
                                spotMeta._audioKeys[lang] = oldSpot._audioKeys[lang];
                            }
                        }
                    }

                    if (editingId) {
                        const idx = spots.findIndex(s => s.id === editingId);
                        if (idx >= 0) {
                            // 如果更换了图片/音频，删除旧文件
                            const old = spots[idx];
                            if (old._imageKey && old._imageKey !== spotMeta._imageKey) await deleteFileFromDB(old._imageKey);
                            for (const lang of ['zh','en','vi']) {
                                const oldKey = old._audioKeys[lang];
                                if (oldKey && oldKey !== spotMeta._audioKeys[lang]) await deleteFileFromDB(oldKey);
                            }
                            spots[idx] = spotMeta;
                        }
                    } else {
                        spots.unshift(spotMeta);
                    }
                    saveLocalMeta();
                    renderList();
                    closeForm();
                    showToast('保存成功');
                });
            }

            function openAdd() {
                editingId = null;
                resetForm();
                $('#formTitle').textContent = '添加点位';
                $('#modalForm').style.display = 'flex';
            }
            function openEdit(id) {
                const spot = spots.find(s => s.id === id);
                if (!spot) return;
                editingId = id;
                $('#editId').value = id;
                $('#nameZh').value = spot.name.zh || '';
                $('#nameEn').value = spot.name.en || '';
                $('#nameVi').value = spot.name.vi || '';
                $('#descZh').value = spot.description.zh || '';
                $('#descEn').value = spot.description.en || '';
                $('#descVi').value = spot.description.vi || '';
                // 清空暂存文件
                pendingImageBlob = null;
                if (pendingImagePreviewUrl) URL.revokeObjectURL(pendingImagePreviewUrl);
                pendingImagePreviewUrl = null;
                pendingAudioBlobs = { zh: null, en: null, vi: null };
                pendingAudioNames = { zh: '', en: '', vi: '' };
                // 显示已有图片
                if (spot._imageUrl) {
                    $('#imagePreview').src = spot._imageUrl;
                    $('#imagePreview').style.display = '';
                    $('#imageLabel').classList.add('uploaded');
                    $('#imageInfo').textContent = '已上传';
                } else {
                    $('#imagePreview').style.display = 'none';
                    $('#imageLabel').classList.remove('uploaded');
                    $('#imageInfo').textContent = '';
                }
                // 显示已有音频文件名（无法直接显示内容，仅显示状态）
                ['zh','en','vi'].forEach(lang => {
                    const L = lang.charAt(0).toUpperCase() + lang.slice(1);
                    if (spot._audioKeys[lang]) {
                        $(`#audio${L}Label`).classList.add('uploaded');
                        $(`#audio${L}Info`).textContent = '已上传';
                    } else {
                        $(`#audio${L}Label`).classList.remove('uploaded');
                        $(`#audio${L}Info`).textContent = '';
                    }
                });
                $('#formTitle').textContent = '编辑点位';
                $('#modalForm').style.display = 'flex';
            }
            function resetForm() {
                ['editId','nameZh','nameEn','nameVi','descZh','descEn','descVi'].forEach(id => $('#'+id).value='');
                pendingImageBlob = null;
                if (pendingImagePreviewUrl) URL.revokeObjectURL(pendingImagePreviewUrl);
                pendingImagePreviewUrl = null;
                pendingAudioBlobs = { zh: null, en: null, vi: null };
                pendingAudioNames = { zh: '', en: '', vi: '' };
                $('#imagePreview').style.display = 'none'; $('#imageInfo').textContent = ''; $('#imageLabel').classList.remove('uploaded');
                ['Zh','En','Vi'].forEach(L => {
                    $(`#audio${L}Info`).textContent = '';
                    $(`#audio${L}Label`).classList.remove('uploaded');
                    $(`#audio${L}Input`).value = '';
                });
                $('#imageInput').value = '';
            }
            function closeForm() { $('#modalForm').style.display = 'none'; }
            function saveLocalMeta() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
            }

            async function exportData() {
                showToast('正在准备导出，请稍候...');
                const exportSpots = [];
                for (const spot of spots) {
                    const item = {
                        id: spot.id,
                        name: {...spot.name},
                        description: {...spot.description},
                        image: '',
                        audio: { zh: '', en: '', vi: '' },
                        audioNames: { zh: '', en: '', vi: '' },
                        createdAt: spot.createdAt
                    };
                    // 图片
                    if (spot._imageKey) {
                        const blob = await getFileFromDB(spot._imageKey);
                        if (blob) item.image = await blobToBase64(blob);
                    }
                    // 音频
                    for (const lang of ['zh','en','vi']) {
                        const key = spot._audioKeys[lang];
                        if (key) {
                            const blob = await getFileFromDB(key);
                            if (blob) item.audio[lang] = await blobToBase64(blob);
                            // 文件名从元数据中无法恢复，可留空或标记
                            item.audioNames[lang] = '';
                        }
                    }
                    exportSpots.push(item);
                }
                const json = JSON.stringify(exportSpots, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'spots.json';
                a.click();
                showToast('数据已导出，请上传到 GitHub');
            }

            function showQR(id) {
                const base = window.location.origin + window.location.pathname.replace('admin.html','index.html');
                const url = base + '?point=' + id;
                $('#qrUrlText').textContent = url;
                $('#qrCanvas').innerHTML = '';
                $('#modalQR').style.display = 'flex';
                try { new QRCode($('#qrCanvas'), { text: url, width: 200, height: 200, colorDark: '#2D3436' }); } catch(e){}
            }
            function showToast(msg, type='') {
                const t = $('#toast');
                t.textContent = msg; t.className = 'toast ' + type + ' show';
                setTimeout(() => t.classList.remove('show'), 3000);
            }
            function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        })();
    </script>
</body>
</html>
